[package]
name = "uniffi-bindgen"
version = "0.0.0"
edition.workspace = true
publish = false

# The UniFFI bindgen CLI, built from the workspace so its version always
# matches the `uniffi` crate dspi-ffi is compiled with.
[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
